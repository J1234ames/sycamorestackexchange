<!DOCTYPE HTML>
<html>
<title>SycamoreStackExchange</title>
<body>
<button id="counter">Click me</button>
<p id="count">0</p>
<script>
    const counter = document.getElementById("counter");
    const count = document.getElementById("count");
    counter.addEventListener("click", increment);
    count.innerHTML = localStorage.getItem("count");
    function increment() {
        count.innerHTML++; 
        localStorage.setItem("count", count.innerHTML);
    };
</script>
</body>
</html>
